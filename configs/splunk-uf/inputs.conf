# Universal Forwarder Inputs Configuration

# FortiGate
[monitor:///var/log/remote/fortigate]
disabled = 0
index = fw
sourcetype = fortigate_log
host_segment = 5
persistentQueueSize = 1GB
initCrcLength = 2048
whitelist = \.log$|\.log\.1$

# Sophos
[monitor:///var/log/remote/sophos]
disabled = 0
index = fw
sourcetype = sophos:xg:logs
host_segment = 5
persistentQueueSize = 1GB
initCrcLength = 2048
whitelist = \.log$|\.log\.1$

# Cisco
[monitor:///var/log/remote/cisco]
disabled = 0
index = cisco
sourcetype = cisco:ios
host_segment = 5
persistentQueueSize = 1GB
initCrcLength = 2048
whitelist = \.log$|\.log\.1$
