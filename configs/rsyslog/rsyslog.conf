# /etc/rsyslog.conf configuration file for syslog-relay
# For more information see: https://www.rsyslog.com/doc/

#################
#### MODULES ####
#################

module(load="imuxsock")  # Local system logging

# UDP syslog reception - tuned for high volume
# threads   = parallel processing threads
# batchSize = messages per batch
module(load="imudp" threads="4" batchSize="256")
input(type="imudp" port="514" rcvbufSize="4m" ruleset="remote")

# Kernel logging
module(load="imklog" permitnonkernelfacility="on")

###########################
#### GLOBAL DIRECTIVES ####
###########################

# NOTE: $RepeatedMsgReduction is intentionally DISABLED because it
# suppresses duplicate messages, which is dangerous for security logs.

# Preserve the full qualified domain name (FQDN) of remote senders
$PreserveFQDN on

# Set default permissions for all log files
$FileOwner syslog
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022
$PrivDropToUser syslog
$PrivDropToGroup syslog

# Work directory
$WorkDirectory /var/spool/rsyslog

# Include all config files in /etc/rsyslog.d/
$IncludeConfig /etc/rsyslog.d/*.conf
