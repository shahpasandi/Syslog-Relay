# /etc/rsyslog.d/remote.conf
# Ruleset for remote logs received on UDP 514.
#
# NOTE: Replace the example IP addresses (192.0.2.x, 10.10.150.x)
# with the actual IP addresses of your network devices.
#
# RFC 5737 defines 192.0.2.0/24 as a TEST-NET-1 block,
# which is safe to use in documentation.

ruleset(name="remote") {

    # ------------------------------------------------------------
    # FortiGate
    # ------------------------------------------------------------
    if $fromhost-ip == '192.0.2.1' then {
        $template FortiGateLogs,"/var/log/remote/fortigate/%FROMHOST-IP%/%$year%-%$month%-%$day%-%$hour%.log"
        *.* ?FortiGateLogs
        & stop
    }

    # ------------------------------------------------------------
    # Sophos
    # ------------------------------------------------------------
    if $fromhost-ip == '192.0.2.10'
    or $fromhost-ip == '192.0.2.11'
    or $fromhost-ip == '192.0.2.12' then {
        $template SophosLogs,"/var/log/remote/sophos/%FROMHOST-IP%/%$year%-%$month%-%$day%-%$hour%.log"
        *.* ?SophosLogs
        & stop
    }

    # ------------------------------------------------------------
    # Cisco (Example subnet: 10.10.150.0/24)
    # ------------------------------------------------------------
    if $fromhost-ip startswith '10.10.150.' then {
        $template CiscoLogs,"/var/log/remote/cisco/%FROMHOST-IP%/%$year%-%$month%-%$day%-%$hour%.log"
        *.* ?CiscoLogs
        & stop
    }

    # ------------------------------------------------------------
    # Fallback for unknown devices
    # ------------------------------------------------------------
    $template DefaultLogs,"/var/log/remote/others/%FROMHOST-IP%/%$year%-%$month%-%$day%-%$hour%.log"
    *.* ?DefaultLogs
    & stop
}
